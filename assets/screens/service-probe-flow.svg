<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#18463f" stroke-width="1"/></pattern></defs><rect width="1440" height="900" fill="#092d2a"/><rect width="1440" height="900" fill="url(#grid)"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="80" y="80" font-size="19" fill="#96cabe" letter-spacing="4">SERVICE PROBE / 验证记录</text><text x="80" y="151" font-size="48" font-weight="700" fill="#f4f2e5">从一段对话，到一份能回查的判断</text><text x="80" y="204" font-size="24" fill="#b9d7ce">已实现流程示意 · 非产品界面截图</text><rect x="80" y="268" width="392" height="310" rx="24" fill="#12443d" stroke="#4a796c"/><text x="110" y="321" font-size="24" fill="#eebe6b">01</text><text x="110" y="379" font-size="34" fill="#f4f2e5" font-weight="700">模拟顾客</text><text x="110" y="437" font-size="23" fill="#c9ddd4">读取剧本和订单事实</text><text x="110" y="477" font-size="23" fill="#c9ddd4">连续追问，尝试触发问题</text><text x="110" y="517" font-size="23" fill="#c9ddd4">不接触隐藏评估答案</text><rect x="524" y="268" width="392" height="310" rx="24" fill="#12443d" stroke="#4a796c"/><text x="554" y="321" font-size="24" fill="#eebe6b">02</text><text x="554" y="379" font-size="34" fill="#f4f2e5" font-weight="700">被测客服</text><text x="554" y="437" font-size="23" fill="#c9ddd4">读取店铺规则与商品资料</text><text x="554" y="477" font-size="23" fill="#c9ddd4">在多轮对话中回答顾客</text><text x="554" y="517" font-size="23" fill="#c9ddd4">按实验组使用不同设置</text><rect x="968" y="268" width="392" height="310" rx="24" fill="#12443d" stroke="#4a796c"/><text x="998" y="321" font-size="24" fill="#eebe6b">03</text><text x="998" y="379" font-size="34" fill="#f4f2e5" font-weight="700">独立裁判</text><text x="998" y="437" font-size="23" fill="#c9ddd4">对照规则检查完整对话</text><text x="998" y="477" font-size="23" fill="#c9ddd4">给出问题类型与原话</text><text x="998" y="517" font-size="23" fill="#c9ddd4">引用必须能逐字找到</text><path d="M483 420h28m-9-8 9 8-9 8" fill="none" stroke="#eebe6b" stroke-width="3"/><path d="M927 420h28m-9-8 9 8-9 8" fill="none" stroke="#eebe6b" stroke-width="3"/><rect x="80" y="625" width="1280" height="130" rx="20" fill="#e9efdf"/><text x="114" y="676" font-size="26" font-weight="700" fill="#183d35">每场留下证据：对话 + 裁判结果 + 引用 + 用量 + 版本</text><text x="114" y="720" font-size="24" fill="#386052">预算、重试与续跑负责让实验跑完；是否判断正确，还需要独立验证。</text><path d="M80 803H1360" stroke="#3a6358"/><text x="80" y="849" font-size="20" fill="#b9d7ce">范围：本地验证工具；真实模型调用，虚构店铺与顾客场景。</text></g></svg>