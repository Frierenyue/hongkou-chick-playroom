<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#18463f" stroke-width="1"/></pattern></defs><rect width="1440" height="900" fill="#092d2a"/><rect width="1440" height="900" fill="url(#grid)"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="80" y="80" font-size="19" fill="#96cabe" letter-spacing="4">SERVICE PROBE / 验证记录</text><text x="80" y="151" font-size="48" font-weight="700" fill="#f4f2e5">216 场对话之后，先停下来校准方法</text><text x="80" y="204" font-size="24" fill="#b9d7ce">三轮真实模型实验 · 每轮三个对照组 · 每组 24 场</text><rect x="80" y="265" width="1280" height="380" rx="22" fill="#12443d"/><text x="112" y="321" font-size="24" fill="#b9d7ce">实验轮次</text><text x="370" y="321" font-size="24" fill="#b9d7ce">完成对话</text><text x="625" y="321" font-size="24" fill="#b9d7ce">缺陷达标数</text><text x="1000" y="321" font-size="24" fill="#b9d7ce">严格对照被判问题</text><text x="112" y="402" font-size="34" fill="#f4f2e5">初始轮</text><text x="370" y="402" font-size="34" fill="#f4f2e5">72/72</text><text x="625" y="402" font-size="34" fill="#eebe6b">0/5</text><text x="1000" y="402" font-size="34" fill="#eebe6b">1/6</text><text x="112" y="493" font-size="34" fill="#f4f2e5">修复 1</text><text x="370" y="493" font-size="34" fill="#f4f2e5">72/72</text><text x="625" y="493" font-size="34" fill="#eebe6b">1/5</text><text x="1000" y="493" font-size="34" fill="#eebe6b">3/6</text><text x="112" y="584" font-size="34" fill="#f4f2e5">修复 2</text><text x="370" y="584" font-size="34" fill="#f4f2e5">72/72</text><text x="625" y="584" font-size="34" fill="#eebe6b">0/5</text><text x="1000" y="584" font-size="34" fill="#eebe6b">3/6</text><text x="80" y="706" font-size="31" fill="#eebe6b" font-weight="700">三轮均未通过继续开发门槛 · 保留全部结果，停在阶段 2</text><text x="80" y="755" font-size="22" fill="#c9ddd4">缺陷达标数不是准确率；严格客服也可能答错，被判问题不等于真正误报。</text><path d="M80 803H1360" strok