<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">BeautyMate 核心流程方案</title><desc id="desc">提供产品信息、用户确认、用品库、目标计划、分步指导，以及识别失败与不适反馈的处理。方案示意，非运行截图。</desc><rect width="1600" height="900" fill="#241622"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="100" y="110" font-size="24" fill="#eaa9d0" letter-spacing="4">BEAUTYMATE / PRODUCT FLOW</text><text x="100" y="205" font-size="55" fill="#fff0f8">从手边的一件产品，到完成一次使用。</text><text x="100" y="262" font-size="27" fill="#c8b6c3">先确认信息，再提供建议；每一步都给用户修正与暂停的机会。</text><g fill="none" stroke="#83516d" stroke-width="3"><path d="M340 425H405M625 425H690M910 425H975M1195 425H1260"/></g><g fill="#372334" stroke="#6b4560" stroke-width="2"><rect x="100" y="340" width="240" height="170" rx="18"/><rect x="395" y="340" width="230" height="170" rx="18"/><rect x="680" y="340" width="230" height="170" rx="18"/><rect x="965" y="340" width="230" height="170" rx="18"/><rect x="1250" y="340" width="250" height="170" rx="18"/></g><g fill="#eaa9d0" font-size="22"><text x="127" y="382">01</text><text x="422" y="382">02</text><text x="707" y="382">03</text><text x="992" y="382">04</text><text x="1277" y="382">05</text></g><g fill="#fff0f8" font-size="29"><text x="127" y="440">提供产品信息</text><text x="422" y="440">用户确认</text><text x="707" y="440">整理用品库</text><text x="992" y="440">选择目标</text><text x="1277" y="440">分步指导</text></g><g fill="#c8b6c3" font-size="21"><text x="127" y="478">拍照或手动输入</text><text x="422" y="478">识别结果可修正</text><text x="707" y="478">优先使用已有产品</text><text x="992" y="478">给出有限的步骤</text><text x="1277" y="478">确认后再继续</text></g><path d="M510 510V580H220" fill="none" stroke="#bc819f" stroke-width="2"/><text x="220" y="624" font-size="24" fill="#dba5c4">信息不清楚 → 补充或手动修正</text><path d="M1375 510V580H1030" fill="none" stroke="#bc819f" stroke-width="2"/><text x="1030" y="624" font-size="24" fill="#dba5c4">出现不适 → 暂停相关计划</text><path d="M100 735H1500" stroke="#6b4560"/><text x="100" y="795" font-size="23" fill="#c8b6c3">方案示意 · 依据现有需求与开发交付整理 · 完整应用仍待联调</text></g></svg>
